[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
[project]
name        = "rpimocap"
version     = "0.5.0"
description = "Raspberry Pi multi-camera 3D motion capture from synchronous stereo video"
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.10"

keywords = [
    "motion capture", "stereo vision", "3D reconstruction",
    "voxel carving", "camera calibration", "neuroscience",
    "raspberry pi", "pose estimation",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Core dependencies — required for all commands
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scipy>=1.11",
    "h5py>=3.9",
    "tifffile>=2023.1",       # TiffCapture: streaming large TIFF stacks
    "scikit-image>=0.21",     # voxel carving (skimage.measure)
]

# ---------------------------------------------------------------------------
[project.optional-dependencies]

# PyQt6 — required for rpimocap-align GUI
gui       = ["PyQt6>=6.8"]

# zarr — faster random-access backend for very large TIFF stacks.
# Falls back to page-by-page tifffile access without it (slower but works).
zarr      = ["zarr>=2.16"]

# PyTorch — required for SAM2 inference.
# The PyPI build is CPU-only. For GPU (CUDA 13.1 / RTX 50xx Blackwell):
#   pip install torch --index-url https://download.pytorch.org/whl/cu131
# Or use environment.yml which installs the GPU build via conda automatically.
torch     = ["torch>=2.7"]

# SAM2 — body part segmentation in rpimocap-segment.
# Install torch with GPU support first (see above), then:
#   pip install -e ".[sam2]"
sam2      = ["sam2>=1.0"]

# MediaPipe — alternative pose detector in rpimocap-run
mediapipe = ["mediapipe>=0.10"]

# PyMaxflow — graph-cut (MRF) segmentation of the texture-distance map
# (texture_distance.graphcut_segment_distance). Optional; the
# threshold backend works without it.
graphcut  = ["PyMaxflow>=1.3"]

# CuPy — GPU port of the Gabor descriptor + texture distance
# (detection.gpu_texture, --device gpu). Optional; the CPU path (OpenCV)
# is the default and needs nothing extra.
#
# NOTE: install the CuPy wheel matching your CUDA toolkit MAJOR version
# MANUALLY — pip cannot detect it, so it is intentionally NOT pinned here:
#     CUDA 12.x →  pip install cupy-cuda12x
#     CUDA 13.x →  pip install cupy-cuda13x
# The 'gpu' extra below pulls the source package as a fallback only; for
# normal use install the matching wheel above instead.
gpu       = ["cupy>=13.0"]

# Development and testing
dev       = ["pytest>=7.4", "pytest-cov", "ruff", "mypy"]

# Install everything (GUI + zarr + torch + SAM2 + mediapipe).
# For GPU (CUDA 13.1 / RTX 50xx) install cu126 torch first, then [all]:
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu126
#   pip install -e ".[all]"
# Or use environment.yml which handles this automatically.
all       = [
    "PyQt6>=6.8",
    "zarr>=2.16",
    "torch>=2.7",
    "sam2>=1.0",
    "mediapipe>=0.10",
    "PyMaxflow>=1.3",
]

# ---------------------------------------------------------------------------
[project.scripts]
rpimocap-calibrate       = "rpimocap.cli.calibrate:main"
rpimocap-autocalib       = "rpimocap.cli.autocalib:main"
rpimocap-run             = "rpimocap.cli.pipeline:main"
rpimocap-align           = "rpimocap.cli.align:main"
rpimocap-segment         = "rpimocap.cli.segment:main"
rpimocap-preview         = "rpimocap.cli.preview:main"
rpimocap-refine-cal      = "rpimocap.cli.refine_cal:main"
rpimocap-calibrate-from-corners = "rpimocap.cli.calibrate_from_corners:main"
rpimocap-download-models = "rpimocap.cli.download_models:main"

# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where   = ["."]
include = ["rpimocap*"]

[tool.setuptools.package-data]
"rpimocap.viewer" = ["assets/*.html"]

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select         = ["E", "F", "W", "I"]
ignore         = ["E501"]

[tool.mypy]
python_version         = "3.10"
ignore_missing_imports = true
