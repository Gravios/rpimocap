name: rpimocap

channels:
  - conda-forge
  - defaults

dependencies:
  # ── Python ──────────────────────────────────────────────────────────────
  - python=3.11            # 3.11 recommended; 3.10 minimum, 3.12 works

  # ── Core scientific stack (conda builds preferred — faster, MKL-linked) ─
  - numpy>=1.24
  - scipy>=1.11
  - scikit-image>=0.21
  - h5py>=3.9
  - tifffile>=2023.7       # multi-frame TIFF stack reading (streaming)
  - zarr>=2.16             # fast page access for BigTIFF / OME-TIFF

  # ── OpenCV ───────────────────────────────────────────────────────────────
  - opencv>=4.8            # conda-forge build includes all codecs

  # ── GUI (rpimocap-align) ─────────────────────────────────────────────────
  - pyqt6>=6.8

  # ── Dev tools ────────────────────────────────────────────────────────────
  - pytest>=7.4
  - pytest-cov
  - ruff
  - mypy

  # ── Pip-only packages ────────────────────────────────────────────────────
  - pip
  - pip:
    # PyTorch with CUDA 12.6 wheels — compatible with CUDA 13.1 runtime
    # (CUDA is backward compatible; RTX 5070 Ti / Blackwell works fine)
    # pytorch-cuda=13.1 is not yet packaged in conda channels (May 2025).
    # Wheels built for cu126 run correctly on CUDA 13.1.
    - --index-url https://download.pytorch.org/whl/cu126
    - torch>=2.7
    - torchvision

    # SAM2 — body part segmentation in rpimocap-segment
    - sam2>=1.0

    # mediapipe — alternative pose detector in rpimocap-run
    - mediapipe>=0.10

# ── Usage ───────────────────────────────────────────────────────────────────
# Create:
#   conda env create -f environment.yml
#
# Activate:
#   conda activate rpimocap
#
# Install rpimocap:
#   pip install -e .
#
# Verify GPU:
#   python -c "import torch; print(torch.cuda.get_device_name(0))"
#
# Download SAM2 weights:
#   rpimocap-download-models --model large
#
# Run tests:
#   python -m pytest tests/
#
# Update existing env:
#   conda env update -f environment.yml --prune
#   pip install -e .
#
# Remove:
#   conda env remove -n rpimocap
